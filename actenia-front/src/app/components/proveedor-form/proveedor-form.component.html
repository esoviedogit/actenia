<main class="form-page">
  <header class="form-header">
    <a class="back-link" routerLink="/proveedores">← Volver a proveedores</a>
    <p class="eyebrow">DIRECTORIO DE CONTACTOS</p>
    <h1>{{ proveedorId ? 'Editar proveedor' : 'Agregar proveedor' }}</h1>
    <p>Registra la información de contacto de un proveedor de tu organización.</p>
  </header>

  <p *ngIf="errorMessage()" class="message-error" role="alert">{{ errorMessage() }}</p>
  <div *ngIf="loadingProveedor()" class="loading-state" aria-live="polite">
    Cargando proveedor...
  </div>

  <form *ngIf="!loadingProveedor()" [formGroup]="proveedorForm" (ngSubmit)="onSubmit()">
    <section class="form-section">
      <h2>Datos del proveedor</h2>
      <div class="field-grid">
        <label class="full-width">
          Nombre del proveedor <b>*</b>
          <input
            type="text"
            formControlName="nombre"
            maxlength="150"
            autocomplete="organization"
            placeholder="Ej. Proveedor de equipos médicos"
          />
          <small
            *ngIf="proveedorForm.get('nombre')?.touched && proveedorForm.get('nombre')?.invalid"
            class="field-error"
            >El nombre es obligatorio (máximo 150 caracteres).</small
          >
        </label>

        <label class="full-width">
          Dirección
          <input
            type="text"
            formControlName="direccion"
            maxlength="500"
            autocomplete="street-address"
            placeholder="Dirección del proveedor"
          />
        </label>

        <label>
          Teléfono fijo
          <input
            type="tel"
            formControlName="telefono_fijo"
            maxlength="50"
            autocomplete="tel"
            placeholder="Teléfono de contacto"
          />
        </label>

        <label>
          Teléfono celular
          <input
            type="tel"
            formControlName="telefono_celular"
            maxlength="50"
            autocomplete="tel"
            placeholder="Celular de contacto"
          />
        </label>

        <label>
          Correo electrónico
          <input
            type="email"
            formControlName="email"
            maxlength="100"
            autocomplete="email"
            placeholder="contacto@proveedor.com"
          />
          <small
            *ngIf="proveedorForm.get('email')?.touched && proveedorForm.get('email')?.invalid"
            class="field-error"
            >Ingresa un correo válido (máximo 100 caracteres).</small
          >
        </label>

        <label>
          Sitio web
          <input
            type="url"
            formControlName="sitio_web"
            maxlength="255"
            autocomplete="url"
            placeholder="https://proveedor.com"
          />
          <small
            *ngIf="
              proveedorForm.get('sitio_web')?.touched && proveedorForm.get('sitio_web')?.invalid
            "
            class="field-error"
            >Ingresa una URL que comience con http:// o https://.</small
          >
        </label>
      </div>
      <p class="required-note"><b>*</b> Campo obligatorio</p>
    </section>

    <footer class="form-actions">
      <a class="button button-secondary" routerLink="/proveedores">Cancelar</a>
      <button class="button button-primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Guardando…' : proveedorId ? 'Guardar cambios' : 'Guardar proveedor' }}
      </button>
    </footer>
  </form>
</main>
