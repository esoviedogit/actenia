<h2 mat-dialog-title>Registrar mantenimiento realizado</h2>
<mat-dialog-content>
  <p class="execution-summary">
    <strong>{{ data.equipoNombre }}</strong>
    <span>{{ data.mesLabel }} {{ data.anio }}</span>
  </p>
  <p *ngIf="errorMessage()" class="dialog-error" role="alert">{{ errorMessage() }}</p>
  <form [formGroup]="form" (ngSubmit)="save()">
    <mat-form-field appearance="outline">
      <mat-label>Tipo de mantenimiento</mat-label>
      <mat-select formControlName="tipo_mantenimiento_id" required>
        <mat-option *ngFor="let type of data.types" [value]="type.id">
          {{ type.nombre }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="form.controls.tipo_mantenimiento_id.hasError('required')">
        Selecciona un tipo de mantenimiento.
      </mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Fecha de ejecución</mat-label>
      <input
        matInput
        type="date"
        formControlName="fecha"
        [min]="dateMin"
        [max]="dateMax"
        required
      />
      <mat-error *ngIf="form.controls.fecha.hasError('required')">
        La fecha de ejecución es obligatoria.
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close()" [disabled]="saving()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()" [disabled]="saving()">
    {{ saving() ? 'Guardando…' : 'Marcar como realizado' }}
  </button>
</mat-dialog-actions>
